# Photoon — servidor estático com rota de SPA.
#
# Copie para /etc/nginx/sites-available/photoon, troque server_name e
# ative com:
#   ln -sf /etc/nginx/sites-available/photoon /etc/nginx/sites-enabled/photoon
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/photoon;
    index index.html;

    # O app é uma SPA: qualquer rota (/app/albuns/123/editor) tem que cair no
    # index.html, senão recarregar a página devolve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets do Vite levam hash no nome — podem ficar no cache pra sempre.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index.html NÃO pode ser cacheado: é ele que aponta para os assets novos.
    # Sem isso, um deploy novo continua servindo o app antigo do cache.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Fotos e elementos são blobs grandes vindos do navegador; o upload em si
    # não passa pelo nginx nesta versão, mas o limite fica pronto pra API.
    client_max_body_size 64m;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
